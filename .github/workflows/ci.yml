name: ci

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONIOENCODING: "utf-8"
  CI: "true"

jobs:
  lint-and-security-gates:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pydantic-settings

      - name: WS1 Gate - Verify Zero Web Scraping Imports in Provider Layer
        run: python scripts/assert_no_web_scraping_imports.py

      - name: WS8 Gate - Verify Dependency License Compliance
        run: python scripts/license_check.py

  test-matrix:
    needs: lint-and-security-gates
    strategy:
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pydantic-settings

      - name: Run Test Suite
        run: pytest tests/test_platform_compat.py tests/test_action_executor_security.py tests/adversarial/

