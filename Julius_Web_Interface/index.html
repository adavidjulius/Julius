<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  
  <title>Julius — Universal Autonomous Agent & Multi-Device Workspace</title>
  <meta name="description" content="Julius autonomous web reasoning, coding, and multi-device operating system interface. Interconnected across Web, iOS Mobile, and Rockchip P200 Android APK." />
  
  <!-- Apple iOS Mobile Web App Meta -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Julius" />
  <meta name="theme-color" content="#121214" />
  <meta name="msapplication-TileColor" content="#121214" />

  <!-- PWA Manifest Link -->
  <link rel="manifest" href="./manifest.webmanifest" />

  <!-- Google Typography Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400;1,700&family=Bebas+Neue&family=JetBrains+Mono:ital,wght@0,300;0,400;0,500;0,700;1,400&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,400&display=swap" rel="stylesheet" />

  <!-- Julius Core Stylesheet -->
  <link rel="stylesheet" href="./css/julius.css" />
</head>
<body>
  <!-- Root Application Container -->
  <div id="app-root">
    <div style="display:flex;height:100vh;align-items:center;justify-content:center;background:#121214;color:#c8b896;font-family:'Atkinson Hyperlegible',sans-serif;font-size:16px;">
      <span>Initializing Julius Prerequisites...</span>
    </div>
  </div>

  <!-- Julius Sandboxed Widget Host Bridge -->
  <script src="./js/widget-runtime.js"></script>

  <!-- Prerequisites Runtime Script -->
  <script src="./js/main.js"></script>

  <!-- Service Worker Registration for PWA Offline Capability -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(err => {
          console.log('[SW] Registration ignored in local sandbox:', err);
        });
      });
    }
  </script>
</body>
</html>
