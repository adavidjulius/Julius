name: Cross-Platform CI Matrix

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  matrix-test:
    name: Test on ${{ matrix.os }} (${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    env:
      PYTHONIOENCODING: "utf-8"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libportaudio2 libxkbcommon-x11-0 xclip

      - name: Run Native Installer (PowerShell on Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          .\install.ps1 -NoBrowser -NoVerify

      - name: Run Native Installer (POSIX on Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          bash install.sh --no-browser --no-verify

      - name: Verify Universal Python Installer
        run: |
          python install.py --no-browser --no-verify

      - name: Verify CLI Launcher Help
        run: |
          python julius.py --help

      - name: Run Platform & Core Test Suite
        shell: bash
        run: |
          if [ -f ".venv/bin/python" ]; then
            ./.venv/bin/python -m pytest tests/test_platform_compat.py tests/test_action_executor_security.py tests/adversarial/ -v
          elif [ -f ".venv/Scripts/python.exe" ]; then
            ./.venv/Scripts/python.exe -m pytest tests/test_platform_compat.py tests/test_action_executor_security.py tests/adversarial/ -v
          else
            python -m pip install pytest pytest-asyncio
            python -m pytest tests/test_platform_compat.py tests/test_action_executor_security.py tests/adversarial/ -v
          fi
